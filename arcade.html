<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Snake Pastel Arcade 2D</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <header class="text-center mb-6 max-w-md w-full">
        <div class="inline-flex items-center gap-2 bg-indigo-100 border border-indigo-200 px-3.5 py-1.5 rounded-full text-indigo-700 text-xs font-bold mb-3 shadow-sm">
            <i class="fa-solid fa-gamepad"></i> HTML5 Canvas & Web Audio OOP
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">Snake Pastel Arcade</h1>
        <p class="text-xs text-slate-500 mt-1">Game interaktif berbasis grid, kelas OOP JavaScript, & efek partikel.</p>
    </header>

    <main class="w-full max-w-md bg-white/80 border border-slate-200 rounded-3xl p-5 shadow-2xl backdrop-blur-md flex flex-col items-center relative">

        <div class="w-full flex items-center justify-between mb-4 px-2">
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-center flex-1 mr-2 shadow-sm">
                <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold">Skor</span>
                <span id="scoreDisplay" class="text-xl font-extrabold text-indigo-600">0</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-center flex-1 ml-2 shadow-sm">
                <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold">Skor Tertinggi</span>
                <span id="highScoreDisplay" class="text-xl font-extrabold text-violet-600">0</span>
            </div>
        </div>

        <div class="relative w-full aspect-square rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 shadow-inner flex items-center justify-center">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full block"></canvas>
            
            <div id="gameOverOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 hidden z-10">
                <div class="w-14 h-14 rounded-2xl bg-rose-100 border border-rose-200 text-rose-600 flex items-center justify-center text-2xl mb-3 shadow-md">
                    <i class="fa-solid fa-heart-crack"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">Game Over!</h3>
                <p id="finalScoreText" class="text-xs text-slate-500 mt-1 mb-5">Skor akhir kamu: 0</p>
                <button onclick="window.restartGame && window.restartGame()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-6 py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Main Lagi
                </button>
            </div>

            <div id="startOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 z-20">
                <div class="w-16 h-16 rounded-2xl bg-indigo-100 border border-indigo-200 text-indigo-600 flex items-center justify-center text-3xl mb-3 shadow-md">
                    <i class="fa-solid fa-worm"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">Snake Pastel Arcade</h3>
                <p class="text-xs text-slate-500 mt-1 mb-5 max-w-xs">Makan buah stroberi manis, kumpulkan poin, dan hindari menabrak dinding!</p>
                <button onclick="window.startGame && window.startGame()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm px-7 py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-play"></i> Mulai Game
                </button>
            </div>
        </div>

        <div class="w-full mt-5 grid grid-cols-3 gap-2 max-w-[260px]">
            <div></div>
            <button onclick="window.setDirection && window.setDirection('UP')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-indigo-600 active:text-white rounded-xl flex items-center justify-center text-slate-700 transition-colors shadow-sm cursor-pointer border border-slate-200">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
            <div></div>
            
            <button onclick="window.setDirection && window.setDirection('LEFT')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-indigo-600 active:text-white rounded-xl flex items-center justify-center text-slate-700 transition-colors shadow-sm cursor-pointer border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button onclick="window.setDirection && window.setDirection('DOWN')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-indigo-600 active:text-white rounded-xl flex items-center justify-center text-slate-700 transition-colors shadow-sm cursor-pointer border border-slate-200">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button onclick="window.setDirection && window.setDirection('RIGHT')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-indigo-600 active:text-white rounded-xl flex items-center justify-center text-slate-700 transition-colors shadow-sm cursor-pointer border border-slate-200">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
